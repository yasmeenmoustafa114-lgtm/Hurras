<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار أصول الجرح والتعديل - المحاضرة الخامسة</title>
    <style>
        :root {
            --bg-color: #FDF5E6;
            --primary-color: #1F618D;
            --hover-color: #154360;
            --correct-bg: #d4edda;
            --correct-border: #c3e6cb;
            --correct-color: #155724;
            --incorrect-bg: #f8d7da;
            --incorrect-border: #f5c6cb;
            --incorrect-color: #721c24;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            font-family: var(--font-main);
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 850px;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            border-top: 5px solid var(--primary-color);
            margin: 40px 0;
        }

        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.5s; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1, h2, h3 { color: var(--primary-color); text-align: center; }
        p { line-height: 1.6; font-size: 1.1rem; }
        
        .quote {
            font-style: italic;
            color: #555;
            background: #f9f9f9;
            padding: 15px;
            border-right: 4px solid var(--primary-color);
            margin: 20px 0;
            border-radius: 4px;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px 20px;
            margin: 10px 0;
            font-size: 1.1rem;
            font-weight: bold;
            font-family: inherit;
            color: #fff;
            background-color: var(--primary-color);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        
        button:hover:not(:disabled) { background-color: var(--hover-color); }
        button:disabled { cursor: not-allowed; opacity: 0.9; }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .question-text { font-size: 1.25rem; font-weight: bold; margin-bottom: 20px; line-height: 1.8; color: #111; }
        .options { margin-bottom: 20px; }
        
        .option-btn {
            background-color: #f1f1f1;
            color: #333;
            text-align: right;
            border: 2px solid transparent;
        }
        
        .option-btn:hover:not(:disabled) { background-color: #e2e2e2; }
        
        .option-btn.correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-color) !important;
        }
        
        .option-btn.incorrect {
            background-color: var(--incorrect-bg) !important;
            border-color: var(--incorrect-border) !important;
            color: var(--incorrect-color) !important;
        }

        .explanation-box {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background-color: #eaf2f8;
            border-right: 4px solid var(--primary-color);
            border-radius: 4px;
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 20px;
        }
        .navigation button { width: 48%; }
        
        .result-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            margin: 0 auto 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- شاشة البداية -->
    <div id="start-screen" class="screen active">
        <h1>اختبار الدرس الخامس: أصول الجرح والتعديل</h1>
        <h3>شروط الجارح والمعدل وقبول الجرح والتعديل وموانعهما</h3>
        <div class="quote">
            قال ابن حجر رحمه الله: "وتقبل التزكية من عارف بأسبابها لا من غير عارف؛ لئلا يزكي بمجرد ما يظهر له من غير ممارسة واختبار..."
        </div>
        <button onclick="startQuiz()">ابدأ الاختبار الآن</button>
    </div>

    <!-- شاشة الاختبار -->
    <div id="quiz-screen" class="screen">
        <div class="question-header">
            <span id="question-counter" style="font-weight: bold; color: var(--primary-color);"></span>
            <span id="score-counter" style="font-size: 0.9rem; color: #666;"></span>
        </div>
        <div class="question-text" id="question-text"></div>
        <div class="options" id="options-container"></div>
        <div class="explanation-box" id="explanation-box"></div>
        <div class="navigation">
            <button id="prev-btn" onclick="prevQuestion()" style="display: none;">السابق</button>
            <button id="next-btn" onclick="nextQuestion()" style="display: none;">التالي</button>
        </div>
    </div>

    <!-- شاشة النتيجة -->
    <div id="result-screen" class="screen">
        <h1>النتيجة النهائية</h1>
        <div class="result-circle" id="final-score"></div>
        <p id="result-message" style="text-align: center; font-weight: bold; font-size: 1.2rem;"></p>
        <div class="quote">
            "الإنصاف والتحري سمتان أساسيتان في عالم الجرح والتعديل."
        </div>
        <button onclick="restartQuiz()">إعادة الاختبار</button>
    </div>
</div>

<script>
    const originalQuestions = [
        // 1
        {
            q: 'لماذا اشترط العلماء أن يكون الجارح والمعدل (عالماً بأسباب الجرح والتعديل) كما بيّن د. عبد الجواد؟',
            options: [
                '1- لأنه بمثابة قاضٍ يصدر حكماً، والقاضي يجب أن يعلم أسس حكمه ولئلا يجرح أو يعدل بما ليس سبباً لذلك',
                '2- حتى يستطيع كتابة الأحاديث بخط جميل',
                '3- حتى يتقن علم الأنساب والتواريخ',
                '4- لأن الرواية لا تصح إلا من عالم بالفقه، لذلك ليس سبباً بما يجرح أو يعدل'
            ],
            answer: 0,
            exp: 'التأصيل العلمي: بيّن د. عبد الجواد أن الجارح بمثابة القاضي، فلا بد أن يعرف ما يثبت العدالة وما يسقطها حتى لا يظلم الرواة ولئلا يجرح أو يعدل بما ليس سبباً لذلك.'
        },
        // 2
        {
            q: 'شرط (أن يكون عارفاً باللغة العربية) حتى لا يطلق عبارة جرح ويقصد بها التعديل أو العكس، يُعد هذا الشرط واحداً من:',
            options: [
                '1- الشروط الأساسية المعتبرة في الجارح والمعدل',
                '2- شروط ثبوت الرواية بالمعنى',
                '3- موانع الجرح المتعلقة بالمجروح',
                '4- شروط غير معتبرة في الجارح والمعدل'
            ],
            answer: 0,
            exp: 'التأصيل العلمي: المعرفة باللغة العربية هي أحد الشروط الأربعة الأساسية المعتبرة فيمن يتصدى للجرح والتعديل.'
        },
        // 3
        {
            q: 'ذكر د. عبد الجواد الشروط الأساسية المعتبرة في كل من الجارح والمعدل، وهي:',
            options: [
                '1- أن يكون عالماً بأسباب الجرح والتعديل، وعارفاً باللغة العربية',
                '2- أن يكون عدلاً ميتيقظاً',
                '3- أن يكون سالماً من التعصب',
                '4- جميع ما سبق'
            ],
            answer: 3,
            exp: 'التأصيل العلمي: هذه هي الشروط الأربعة الأساسية التي يجب أن تتوفر في الجارح والمعدل حتى يُقبل كلامه.'
        },
        // 4
        {
            q: 'العبارة التالية: (التعديل للرواة يكون لنوعين: نوع عام يشترك فيه العامة كالصلاة والورع، ونوع خاص كالضبط والتيقظ يحكم به علماء الحديث فقط).',
            options: [
                '1- العبارة صحيحة',
                '2- العبارة خاطئة'
            ],
            answer: 0,
            exp: 'التأصيل العلمي: العبارة صحيحة؛ وقد نص ابن حجر على أن التزكية تُقبل من عارف بأسبابها لا من غير عارف لئلا يزكي بمجرد الظاهر.'
        },
        // 5
        {
            q: 'العبارة: (اشترط العلماء أن يكون الجارح "عدلاً"، لذلك رُدَّ تجريح ابن خراش لرواة أهل السنة لكونه غالياً في التشيع غير مرضي العدالة).',
            options: [
                '1- العبارة صحيحة الشقين',
                '2- العبارة خاطئة الشقين',
                '3- الشق الأول صحيح وخاطئة الشق الثاني',
                '4- الشق الأول خاطئ وصحيحة الشق الثاني'
            ],
            answer: 0,
            exp: 'التأصيل العلمي: العبارة صحيحة الشقين؛ فالعدالة شرط أساسي، وابن خراش كان مجروح العدالة لغلوه ورفضه فَرُدَّ جرحه فيمن خالفه.'
        },
        // 6
        {
            q: 'ما هو السبب الرئيسي الذي جعل العلماء لا يلتفتون لتضعيف (أبي الفتح الأزدي) للراوي أحمد بن شبيب الحبطي؟',
            options: [
                '1- لأن الأزدي نفسه كان "غير مرضي" ومجروحاً في نفسه وفي كتابه مآخذ',
                '2- لأن الأزدي كان أعمى لا يحفظ',
                '3- لأن الأزدي كان متأخراً جداً عنه',
                '4- لأن الحبطي كان من أقارب الأزدي'
            ],
            answer: 0,
            exp: 'التأصيل العلمي: رد ابن حجر كلام الأزدي قائلاً: "الأزدي غير مرضي"، فهو مثال على أن يكون الجارح مجروحاً في نفسه فلا يُقبل.'
        },
        // 7
        {
            q: 'من الشروط (غير المعتبرة) في الجارح والمعدل أي أنه لا يُشترط وجودها لقبول جرحه أو تعديله:',
            options: [
                '1- الذكورة والحرية',
                '2- العدالة والتيقظ',
                '3- الإسلام',
                '4- المعرفة باللغة العربية'
            ],
            answer: 0,
            exp: 'التأصيل العلمي: الذكورة والحرية شروط غير معتبرة، فيُقبل الجرح والتعديل من المرأة والعبد.'
        },
        // 8
        {
            q: 'استدل د. عبد الجواد بقبول شهادة الجارية (بريرة) في حادثة الإفك على عدم اشتراط:',
            options: [
                '1- الذكورة في التعديل',
                '2- الحرية في التعديل',
                '3- كلاهما (1+2)',
                '4- التعدد في التعديل'
            ],
            answer: 2,
            exp: 'التأصيل العلمي: بريرة كانت امرأة وكانت أمة (أو جارية قبل عتقها)، فدل سؤال النبي صلى الله عليه وسلم لها وقبول قولها على عدم اشتراط الذكورة والحرية.'
        },
        // 9
        {
            q: 'العبارة التالية: (يُقبل الجرح والتعديل من الصبي المراهق الذي قارب البلوغ قياساً على صحة تحمله للحديث وسماعه).',
            options: [
                '1- العبارة صحيحة',
                '2- العبارة خاطئة'
            ],
            answer: 1,
            exp: 'التأصيل العلمي: العبارة خاطئة؛ لأن الصبي المراهق أو الطفل المميز لا يُقبل قوله في الجرح والتعديل لكونه غير مكلف ولا يدرك خطورة كلامه.'
        },
        // 10
        {
            q: 'هل يُشترط (التعدد) في الجرح والتعديل؛ بمعنى ألا يثبت الجرح والتعديل إلا بقول اثنين من الأئمة؟',
            options: [
                '1- لا يُشترط، لأن الجرح والتعديل إما من باب الرواية (ويكفي فيها واحد) أو من باب حكم القاضي (ويكفي فيه واحد أيضاً)',
                '2- نعم، قياساً على الشهادة في المحاكم',
                '3- يُشترط في الجرح دون التعديل',
                '4- يُشترط في التعديل دون الجرح'
            ],
            answer: 0,
            exp: 'التأصيل العلمي: لا يُشترط التعدد، فيكفي قول إمام واحد ثقة عارف بالجرح والتعديل.'
        },
        // 11
        {
            q: 'ما هو المقصود بمصطلح (التفسير التفصيلي) في الجرح؟',
            options: [
                '1- أن يذكر بدقة سبب جرحه وحادثته، كقوله "رأيته فعل كذا" أو "روى حديث كذا فغيّر فيه"',
                '2- أن يذكر سبباً عاماً كقوله "مغفل" أو "سيء الحفظ"',
                '3- أن يكتب كتاباً كاملاً عن الراوي',
                '4- أن يقسم بالله على صحة جرحه'
            ],
            answer: 0,
            exp: 'التأصيل العلمي: التفسير التفصيلي هو بيان السبب الدقيق وراء الحكم، بخلاف الإجمالي الذي يطلق وصفاً عاماً دون تفصيل الحادثة.'
        },
        // 12
        {
            q: 'اختلفت المذاهب في حكم اشتراط (تفسير الجرح والتعديل). ماذا يقرر المذهب الأول؟',
            options: [
                '1- اشتراط تفسير كل من الجرح والتعديل، فلا يُقبلان إلا مفسَّرين',
                '2- اشتراط التفسير في التعديل دون الجرح',
                '3- اشتراط التفسير في الجرح دون التعديل',
                '4- عدم اشتراط التفسير مطلقاً'
            ],
            answer: 0,
            exp: 'التأصيل العلمي: المذهب الأول (وهو غير مشهور) اشترط بيان سبب الجرح وسبب التعديل معاً.'
        },
        // 13
        {
            q: 'المذهب الثاني اشترط تفسير (التعديل) ولم يشترط (الجرح). ما هي حجتهم في ذلك؟',
            options: [
                '1- لأن العدالة قد يُتصنّع لها بالظاهر، فيجب أن يبين المعدل سبب التعديل لئلا يغتر بالظاهر',
                '2- لأن الجرح هو الأصل في الناس',
                '3- لأن التعديل يحتاج إلى وقت طويل',
                '4- لأن الجرح يؤدي إلى القتل'
            ],
            answer: 0,
            exp: 'التأصيل العلمي: حجتهم أن العدالة قد يتصنعها الراوي، فربما يغتر المعدل بالمظاهر كما قيل في أحمد بن يونس: لو رأيت لحيته وخضابه لعرفت أنه ثقة.'
        },
        // 14
        {
            q: 'العبارة: (قرر المذهب الثالث -وهو رأي أبي بكر الباقلاني- أنه لا يُشترط تفسير الجرح ولا التعديل إذا صدرا من إمام عارف بصير بأسباب الجرح والتعديل).',
            options: [
                '1- العبارة صحيحة الشقين',
                '2- العبارة خاطئة الشقين',
                '3- الشق الأول صحيح وخاطئة الشق الثاني',
                '4- الشق الأول خاطئ وصحيحة الشق الثاني'
            ],
            answer: 0,
            exp: 'التأصيل العلمي: العبارة صحيحة الشقين؛ لأن الباقلاني والجمهور يرون أن العارف البصير لا يُسأل عن التفسير لثقتنا بعلمه ودينه.'
        },
        // 15
        {
            q: 'المذهب الرابع (وهو رأي ابن الصلاح والنووي وجمهور المتأخرين) فرّق بين الجرح والتعديل فاشترط:',
            options: [
                '1- تفسير الجرح وبيان سببه',
                '2- عدم اشتراط تفسير التعديل',
                '3- كلاهما (1+2)',
                '4- عدم قبول أي منهما'
            ],
            answer: 2,
            exp: 'التأصيل العلمي: المذهب الرابع يشترط بيان الجرح لاختلاف أسبابه، ويقبل التعديل مجملاً لأن أسبابه كثيرة ويشق ذكرها.'
        },
        // 16
        {
            q: 'من موانع قبول الجرح المتعلقة بـ "الجارح نفسه" جميع ما يلي عدا واحدة:',
            options: [
                '1- أن يكون الجارح مجروحاً في نفسه',
                '2- أن يكون الجارح من المتشددين أو المتعنتين',
                '3- رجوع المجروح وتوبته مما وقع منه',
                '4- كون الجارح متأخراً عن المجروح'
            ],
            answer: 2,
            exp: 'التأصيل العلمي: رجوع المجروح وتوبته مما وقع منه هو مانع متعلق بـ (المجروح نفسه) وليس بالجارح، لذلك نستبعده.'
        },
        // 17
        {
            q: 'لماذا رجح العلماء في المذهب الرابع قبول (التعديل المجمل) بلا تفسير؟',
            options: [
                '1- لأن أسباب العدالة كثيرة جداً (كذكر الصلاة والصيام وترك المحرمات) ويشق حصرها، ولأن الأصل في المسلمين الستر والعدالة',
                '2- لأن التعديل يخص الصحابة فقط',
                '3- لأن الجارحين كانوا يخافون من السلاطين',
                '4- لأن التعديل المجمل أقوى في اللغة'
            ],
            answer: 0,
            exp: 'التأصيل العلمي: أسباب التعديل كثيرة جداً ويشق حصرها، والأصل في المسلمين الستر والعدالة، لذلك نقبل التعديل من غير تفسير.'
        },
        // 18
        {
            q: 'وقوع (التحامل بين الأقران) كما حدث بين الإمام مالك ومحمد بن إسحاق، يُعد مانعاً من موانع:',
            options: [
                '1- قبول التعديل',
                '2- قبول الجرح، وهو متعلق بالجارح نفسه',
                '3- ثبوت الرواية بالمعنى',
                '4- موانع متعلقة بالجرح نفسه كأمر نسبي'
            ],
            answer: 1,
            exp: 'التأصيل العلمي: التحامل بين الأقران هو مانع من موانع قبول الجرح، ويصنف ضمن الموانع المتعلقة بالجارح نفسه.'
        },
        // 19
        {
            q: 'العبارة: (اشترط المذهب الرابع تفسير الجرح؛ لأن أسباب الجرح تختلف, فقد يجرح إمامٌ راوياً لسبب لا يُعد جرحاً عند غيره، كركوب البرذون والركض عليه).',
            options: [
                '1- العبارة صحيحة',
                '2- العبارة خاطئة'
            ],
            answer: 0,
            exp: 'التأصيل العلمي: العبارة صحيحة؛ فقد جرح شعبة رجلاً لركوبه البرذون وتبختره عليه، وهذا لا يُسقط العدالة عند غيره.'
        },

        },

        {

            options: [

            options: [

        // 52
        {

                '2- العبارة خاطئة'

            answer: 1,
            exp: 'التأصيل العلمي: مجرد رواية الثقة عن شخص لا تُعد تعديلاً له عند الجمهور، وإن كان ابن حبان يتساهل في ذلك.'
        }
    ];

    function shuffleArray(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    let quizQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let userAnswers = [];

    function initQuiz() {
        quizQuestions = shuffleArray([...originalQuestions]);
        userAnswers = new Array(quizQuestions.length).fill(null);
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function startQuiz() {
        initQuiz();
        currentQuestionIndex = 0;
        score = 0;
        switchScreen('quiz-screen');
        renderQuestion();
    }

    function renderQuestion() {
        const qData = quizQuestions[currentQuestionIndex];
        
        document.getElementById('question-counter').innerText = 'السؤال ' + (currentQuestionIndex + 1) + ' من ' + quizQuestions.length;
        document.getElementById('score-counter').innerText = 'النقاط: ' + score;
        document.getElementById('question-text').innerText = qData.q;
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        qData.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            
            if(userAnswers[currentQuestionIndex] !== null) {
                btn.disabled = true;
                if(index === qData.answer) {
                    btn.classList.add('correct');
                } else if(index === userAnswers[currentQuestionIndex]) {
                    btn.classList.add('incorrect');
                }
            } else {
                btn.onclick = () => selectOption(index, btn);
            }
            
            optionsContainer.appendChild(btn);
        });

        const expBox = document.getElementById('explanation-box');
        if(userAnswers[currentQuestionIndex] !== null) {
            expBox.style.display = 'block';
            expBox.innerHTML = qData.exp;
        } else {
            expBox.style.display = 'none';
        }

        document.getElementById('prev-btn').style.display = currentQuestionIndex > 0 ? 'block' : 'none';
        
        const nextBtn = document.getElementById('next-btn');
        if(currentQuestionIndex === quizQuestions.length - 1) {
            nextBtn.innerText = 'إنهاء الاختبار';
            nextBtn.style.display = userAnswers[currentQuestionIndex] !== null ? 'block' : 'none';
            nextBtn.onclick = showResult;
        } else {
            nextBtn.innerText = 'التالي';
            nextBtn.style.display = userAnswers[currentQuestionIndex] !== null ? 'block' : 'none';
            nextBtn.onclick = nextQuestion;
        }
    }

    function selectOption(selectedIndex, btnElement) {
        const qData = quizQuestions[currentQuestionIndex];
        userAnswers[currentQuestionIndex] = selectedIndex;
        
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(btn => btn.disabled = true);

        if (selectedIndex === qData.answer) {
            btnElement.classList.add('correct');
            score++;
            document.getElementById('score-counter').innerText = 'النقاط: ' + score;
        } else {
            btnElement.classList.add('incorrect');
            allBtns[qData.answer].classList.add('correct');
        }

        const expBox = document.getElementById('explanation-box');
        expBox.style.display = 'block';
        expBox.innerHTML = qData.exp;

        const nextBtn = document.getElementById('next-btn');
        nextBtn.style.display = 'block';
    }

    function nextQuestion() {
        if(currentQuestionIndex < quizQuestions.length - 1) {
            currentQuestionIndex++;
            renderQuestion();
        }
    }

    function prevQuestion() {
        if(currentQuestionIndex > 0) {
            currentQuestionIndex--;
            renderQuestion();
        }
    }

    function showResult() {
        switchScreen('result-screen');
        const finalScoreElem = document.getElementById('final-score');
        finalScoreElem.innerText = score + ' / ' + quizQuestions.length;
        
        const percentage = (score / quizQuestions.length) * 100;
        let msg = '';
        if(percentage === 100) msg = 'ممتاز جداً! لقد استوعبت كل تفاصيل المحاضرة بدقة متناهية.';
        else if(percentage >= 80) msg = 'رائع! استيعابك قوي، راجع التأصيلات التي أخطأت فيها فقط.';
        else if(percentage >= 50) msg = 'جيد، لكنك تحتاج إلى مراجعة بعض المفاهيم الدقيقة في الدرس.';
        else msg = 'لا بأس، العلم يحتاج إلى تكرار. استمع للمحاضرة مرة أخرى وأعد الاختبار.';
        
        document.getElementById('result-message').innerText = msg;
    }

    function restartQuiz() {
        switchScreen('start-screen');
    }
</script>
