<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار أصول الجرح والتعديل - المحاضرة السادسة</title>
    <style>
        :root {
            --bg-color: #FDF5E6;
            --primary-color: #1F618D;
            --hover-color: #154360;
            --correct-bg: #d4edda;
            --correct-border: #c3e6cb;
            --correct-color: #155724;
            --incorrect-bg: #f8d7da;
            --incorrect-border: #f5c6cb;
            --incorrect-color: #721c24;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            font-family: var(--font-main);
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 850px;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            border-top: 5px solid var(--primary-color);
            margin: 40px 0;
        }

        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.5s; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1, h2, h3 { color: var(--primary-color); text-align: center; }
        p { line-height: 1.6; font-size: 1.1rem; }
        
        .quote {
            font-style: italic;
            color: #555;
            background: #f9f9f9;
            padding: 15px;
            border-right: 4px solid var(--primary-color);
            margin: 20px 0;
            border-radius: 4px;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px 20px;
            margin: 10px 0;
            font-size: 1.1rem;
            font-weight: bold;
            font-family: inherit;
            color: #fff;
            background-color: var(--primary-color);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        
        button:hover:not(:disabled) { background-color: var(--hover-color); }
        button:disabled { cursor: not-allowed; opacity: 0.9; }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .question-text { font-size: 1.25rem; font-weight: bold; margin-bottom: 20px; line-height: 1.8; color: #111; }
        .options { margin-bottom: 20px; }
        
        .option-btn {
            background-color: #f1f1f1;
            color: #333;
            text-align: right;
            border: 2px solid transparent;
        }
        
        .option-btn:hover:not(:disabled) { background-color: #e2e2e2; }
        
        .option-btn.correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-color) !important;
        }
        
        .option-btn.incorrect {
            background-color: var(--incorrect-bg) !important;
            border-color: var(--incorrect-border) !important;
            color: var(--incorrect-color) !important;
        }

        .explanation-box {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background-color: #eaf2f8;
            border-right: 4px solid var(--primary-color);
            border-radius: 4px;
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 20px;
        }
        .navigation button { width: 48%; }
        
        .result-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            margin: 0 auto 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- شاشة البداية -->
    <div id="start-screen" class="screen active">
        <h1>اختبار الدرس السادس: أصول الجرح والتعديل</h1>
        <h3>أسباب الجرح والتعديل وأقسامهما</h3>
        <div class="quote">
            قال محمد بن سيرين رحمه الله: "إن هذا العلم دين، فانظروا عمن تأخذون دينكم" [6]
        </div>
        <button onclick="startQuiz()">ابدأ الاختبار الآن</button>
    </div>

    <!-- شاشة الاختبار -->
    <div id="quiz-screen" class="screen">
        <div class="question-header">
            <span id="question-counter" style="font-weight: bold; color: var(--primary-color);"></span>
            <span id="score-counter" style="font-size: 0.9rem; color: #666;"></span>
        </div>
        <div class="question-text" id="question-text"></div>
        <div class="options" id="options-container"></div>
        <div class="explanation-box" id="explanation-box"></div>
        <div class="navigation">
            <button id="prev-btn" onclick="prevQuestion()" style="display: none;">السابق</button>
            <button id="next-btn" onclick="nextQuestion()" style="display: none;">التالي</button>
        </div>
    </div>

    <!-- شاشة النتيجة -->
    <div id="result-screen" class="screen">
        <h1>النتيجة النهائية</h1>
        <div class="result-circle" id="final-score"></div>
        <p id="result-message" style="text-align: center; font-weight: bold; font-size: 1.2rem;"></p>
        <div class="quote">
            "الاحتياط لحديث رسول الله ﷺ هو الغاية العظمى لعلماء الجرح والتعديل." [7]
        </div>
        <button onclick="restartQuiz()">إعادة الاختبار</button>
    </div>
</div>

<script>
    const originalQuestions = [
        // 1
        {
            q: 'قسّم د. عبد الجواد ما يثبت به تعديل الراوي إلى أمرين أساسيين يكتمل بهما مصطلح (الثقة). ما هما؟',
            options: [
                '1- بيان اتصافه بالعدالة في دينه وبيان اتصافه بالضبط',
                '2- الذكورة والبلوغ وغزارة الحفظ',
                '3- بيان الشيوخ وكثرة النسب القرشي والفصاحة',
                '4- حفظ القرآن وحضور مجالس العلم'
            ],
            answer: 0,
            exp: 'التأصيل العلمي: بيان اتصاف الراوي بالعدالة في دينه والضبط في حفظه هما ركيزتا التوثيق اللتان باجتماعهما يستحق الراوي لقب (ثقة) [8، 9].'
        },
        // 2
        {
            q: 'العبارة التالية: يُشترط في تزكية الراوي وتعديله استخدام ألفاظ محددة حصراً كقولهم "عدل ضابط"، ولا يُقبل التعديل بالمعنى كقولهم "مقبول الشهادة".',
            options: [
                '1- العبارة صحيحة',
                '2- العبارة خاطئة'
            ],
            answer: 1,
            exp: 'التأصيل العلمي: العبارة خاطئة؛ لأن العبرة في التعديل هي بالمعاني لا بالألفاظ، فكل لفظ دل على الرضا والتزكية يُقبل به التعديل [10، 11].'
        },
        // 3
        {
            q: 'حسب التقسيم الهيكلي لأسباب الجرح؛ أن يكون الراوي شديد الغفلة أو يقبل التلقين، هي أمور تندرج تحت أي قسم؟',
            options: [
                '1- الجرح في المروءة',
                '2- الجرح في الضبط',
                '3- موانع الجرح',
                '4- الجرح في العدالة'
            ],
            answer: 1,
            exp: 'التأصيل العلمي: شدة الغفلة وقبول التلقين والوهم والاختلاط هي قوادح تصيب ضبط الراوي وإتقانه للحفظ [8].'
        },
        // 4
        {
            q: 'كل الأمور التالية متعلقة ومؤثرة في (العدالة الدينية للراوي) عدا أمر واحد يُعد من قوادح (الضبط)، فما هو؟',
            options: [
                '1- الفسق والمجون والفساد السلوكي',
                '2- البدعة والجهالة بحال الراوي',
                '3- كثرة الغفلة وقبول التلقين',
                '4- أخذ الأجرة على رواية الحديث النبوي'
            ],
            answer: 2,
            exp: 'التأصيل العلمي: كثرة الغفلة وقبول التلقين من قوادح الضبط وليس العدالة، بينما الفسق والبدعة والجهالة وأخذ الأجرة تؤثر في العدالة الدينية [12، 13].'
        },
        // 5
        {
            q: 'العبارة: إذا اجتمعت العدالة والضبط في الراوي سُمي "ثقة"، وبعض العلماء قد يطلق مصطلح الثقة تجوّزاً على مجرد التعديل الديني.',
            options: [
                '1- الشق الأول من العبارة صحيح والشق الثاني خاطئ',
                '2- العبارة خاطئة الشقين',
                '3- العبارة صحيحة الشقين',
                '4- الشق الأول من العبارة خاطئ والشق الثاني صحيح'
            ],
            answer: 2,
            exp: 'التأصيل العلمي: العبارة صحيحة الشقين؛ فالثقة هو من جمع العدالة والضبط، ولكن قد يُطلق تجوزاً على أحدهما [9، 10].'
        },
        // 6
        {
            q: 'كيف عرّف العلماء "السفه" الذي يُرد به حديث الراوي كما بيّن د. عبد الجواد؟',
            options: [
                '1- هو الاختلاط الشديد بمرور السنين',
                '2- هو الخفة والطيش وعدم المبالاة بالأخلاق العامة والمروءة',
                '3- هو الفقر الشديد وعسر المعيشة',
                '4- هو نسيان الحديث بكثرة بسبب كبر السن'
            ],
            answer: 1,
            exp: 'التأصيل العلمي: السفه هو الخفة والطيش وقبح الحياء وملازمة أهل اللهو والمجون مما يُسقط هيبة الراوي ومروءته [14، 15].'
        },
        // 7
        {
            q: 'سمع الإمام يحيى بن سعيد القطان رحمه الله راوياً يقول في مجلسه: (إن لم أحدثكم فأمي زانية)، فقال يحيى معقباً ومستنكراً: (فإنما تركتُه لهذا). هذا الموقف الصارم من القطان يمثل تطبيقاً لأي سبب من أسباب الجرح؟',
            options: [
                '1- الجرح بالتدليس والجهالة',
                '2- الجرح بالسفه والمجون والتلفظ بالفحش',
                '3- الجرح بالبدعة غير المكفرة',
                '4- الجرح بقبول التلقين'
            ],
            answer: 1,
            exp: 'التأصيل العلمي: تلفظ الراوي بالفحش الصادم على أمه يُسقط مروءته تماماً، فلهذا ترك القطان الرواية عنه صيانة لحديث رسول الله ﷺ من السفهاء [3].'
        },
        // 8
        {
            q: 'العبارة التالية: أجاز الإمام مالك رحمه الله أخذ العلم عن السفيه المعلن بسفهه إذا كان أروى الناس وأكثرهم حفظاً للحديث.',
            options: [
                '1- العبارة صحيحة',
                '2- العبارة خاطئة'
            ],
            answer: 1,
            exp: 'التأصيل العلمي: العبارة خاطئة؛ فالإمام مالك قال صراحة: "لا تأخذ العلم من أربعة: سفيه معلن بالسفه وإن كان أروى الناس..." [9].'
        },
        // 9
        {
            q: 'قال الإمام مالك رحمه الله: "لا تأخذ العلم من أربعة...". ما هي هذه الأصناف الأربعة؟',
            options: [
                '1- سفيه معلن بالسفه، وصاحب هوى يدعو الناس إلى هواه',
                '2- كذاب يكذب في حديث الناس، وشيخ له فضل وعبادة لا يعرف ما يحدث',
                '3- كلاهما (1+2)',
                '4- المبتدع الذي لا يدعو لبدعته، والراوي مجهول العين'
            ],
            answer: 2,
            exp: 'التأصيل العلمي: الأصناف الأربعة التي حذر منها الإمام مالك هي: السفيه المعلن، وصاحب البدعة الداعية، والكذاب في أحاديث الناس، والشيخ العابد الذي لا يعرف ما يحدث [16، 17، 18].'
        },
        // 10
        {
            q: 'ما حكم رواية (الفاسق) الذي ارتكب كبيرة ومات دون توبة؟',
            options: [
                '1- تُرد روايته لزوال شرط العدالة، والآية صريحة في النهي عن قبول خبر الفاسق والتوقف فيه',
                '2- تُقبل روايته إن كان ضابطاً وحافظاً',
                '3- تتوقف روايته على موافقة تلاميذه الأثبات',
                '4- تُقبل في فضائل الأعمال والرقائق فقط'
            ],
            answer: 0,
            exp: 'التأصيل العلمي: الفاسق المصر على كبيرة حتى مماته دون توبة تُرد روايته باتفاق لزوال أمانته الدينية، والآية صريحة في وجوب التثبت والتوقف في خبر الفاسق [19، 20].'
        },
        // 11
        {
            q: 'العبارة: تُقبل رواية من تاب من الكذب في أحاديث الناس، بينما تُرد روايته أبداً إذا كان كذبه متعمداً في حديث رسول الله صلى الله عليه وسلم ولو حسنت توبته.',
            options: [
                '1- الشق الأول صحيح والشق الثاني خاطئ',
                '2- العبارة خاطئة الشقين',
                '3- العبارة صحيحة الشقين',
                '4- الشق الأول خاطئ والشق الثاني صحيح'
            ],
            answer: 2,
            exp: 'التأصيل العلمي: العبارة صحيحة الشقين؛ فالكذب على رسول الله صلى الله عليه وسلم ذنب عظيم، والاحتياط للسنة يقتضي رد رواية فاعله أبداً زجراً له وتغليظاً [24، 25].'
        },
        // 12
        {
            q: 'ضرب د. عبد الجواد مثلاً براوٍ كان (قاطعاً للطريق وسارقاً) ثم تاب وصلح حاله فصار من كبار العلماء الزهاد، ليدلل على قبول رواية التائب من الفسق. من هو؟',
            options: [
                '1- سفيان الثوري رحمه الله',
                '2- الفضيل بن عياض رحمه الله',
                '3- يحيى بن معين رحمه الله',
                '4- شعبة بن الحجاج رحمه الله'
            ],
            answer: 1,
            exp: 'التأصيل العلمي: الفضيل بن عياض رحمه الله كان في شبابه قاطعاً للطريق، ثم تاب وحسنت توبته وصار قدوة الأمة في الزهد والعبادة والصدق [10].'
        },
        // 13
        {
            q: 'العبارة التالية: مجرد وقوع الراوي في هفوة أو ذنب غير مقصود يُسقط عدالته فوراً ويوجب جرحه؛ لأن المحدثين يشترطون العصمة في الرواة.',
            options: [
                '1- العبارة صحيحة',
                '2- العبارة خاطئة'
            ],
            answer: 1,
            exp: 'التأصيل العلمي: العبارة خاطئة؛ فالعصمة ليست شرطاً في الراوي، وهي للأنبياء فقط، والهفوات والذنوب الصغرى لا تُسقط العدالة طالما لم يصر عليها الراوي [11].'
        },
        // 14
        {
            q: 'في أي نوع من الرواة أطلق الإمام أحمد بن حنبل هذا الحكم الصارم: "توبته فيما بينه وبين الله تعالى، ولا يُكتب حديثه أبداً"؟',
            options: [
                '1- الراوي الذي كذب في حديث واحد متعمداً على النبي صلى الله عليه وسلم ثم تاب',
                '2- الراوي الذي كثر منه النسيان والوهم في كبره',
                '3- المبتدع غير الداعية الذي يروي ما لا يؤيد بدعته',
                '4- الراوي الذي يكذب في تجارته ومعاملات الناس'
            ],
            answer: 0,
            exp: 'التأصيل العلمي: قال الإمام أحمد هذا في حق الكاذب في الحديث النبوي، تغليظاً في حماية الدين واحتياطاً لحديث رسول الله صلى الله عليه وسلم [12].'
        },
        // 15
        {
            q: 'قياس مسألة (عدم قبول رواية التائب من الكذب في الحديث) على مسألة (عدم عودة صفة الإحصان لمن زنى وتاب، وعدم قبول قذفه)، هو توجيه فقهي ذكره أي إمام؟',
            options: [
                '1- الخطيب البغدادي رحمه الله',
                '2- الإمام السيوطي رحمه الله',
                '3- الإمام النووي رحمه الله',
                '4- الإمام مالك رحمه الله'
            ],
            answer: 1,
            exp: 'التأصيل العلمي: الإمام السيوطي رحمه الله هو من وجّه قول الجمهور وعضّده بهذا الشاهد من أحكام الشريعة في الزاني التائب [28، 29].'
        },
        // 16
        {
            q: 'خالف الإمام (النووي) مذهب الجمهور ومال إلى قبول رواية التائب من الكذب في الحديث النبوي، وقاس ذلك على أصول شرعية منها:',
            options: [
                '1- قبول شهادته في القضاء بعد التوبة',
                '2- قبول رواية الكافر بعد إسلامه وتوبته من الكفر',
                '3- كلاهما (1+2)',
                '4- قبول رواية مجهول العين'
            ],
            answer: 2,
            exp: 'التأصيل العلمي: استدل الإمام النووي رحمه الله بأن الكافر يُقبل حديثه إذا أسلم وتاب، وأن شهادة القاذف تُقبل إذا تاب، فالراوي التائب أولى بالقبول [27، 28].'
        },
        // 17
        {
            q: 'إنكار أمر قطعي متواتر من الشرع ومعلوم من الدين بالضرورة (كوجوب الصلاة)، يُصنف في علم الجرح والتعديل ضمن:',
            options: [
                '1- قبيح السلوك المعفي عنه',
                '2- البدع غير المكفرة التي يُقبل حديث صاحبها',
                '3- البدع المكفرة التي يُرد حديث صاحبها إجماعاً',
                '4- قوادح الضبط الخفية'
            ],
            answer: 2,
            exp: 'التأصيل العلمي: إنكار القطعيات المعلومة بالضرورة يؤدي للكفر، وصاحب البدعة المكفرة لا تُقبل روايته إجماعاً [33، 35].'
        },
        // 18
        {
            q: 'العبارة: كل من وقع في فعل بدعة يُسمى اصطلاحاً "مبتدعاً" وتُرد روايته، حتى لو لم تكن البدعة له منهجاً ومسلكاً مستمراً.',
            options: [
                '1- الشق الأول صحيح والشق الثاني خاطئ',
                '2- العبارة خاطئة الشقين',
                '3- العبارة صحيحة الشقين',
                '4- الشق الأول خاطئ والشق الثاني صحيح'
            ],
            answer: 1,
            exp: 'التأصيل العلمي: العبارة خاطئة الشقين؛ فالإنسان لا يُطلق عليه وصف مبتدع اصطلاحاً بمجرد هفوة أو وقوع عابر في بدعة، بل إذا اتخذها مسلكاً ومنهجاً [30، 31].'
        },

        },

        {

            answer: 0,
            exp: 'التأصيل العلمي: ترتفع جهالة العين وتزول برواية شخصين أو تلميذين معتبرين عن الراوي، فينتقل بذلك لمرتبة مجهول الحال [38، 67].'

    function shuffleArray(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    let quizQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let userAnswers = [];

    function initQuiz() {
        quizQuestions = shuffleArray([...originalQuestions]);
        userAnswers = new Array(quizQuestions.length).fill(null);
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function startQuiz() {
        initQuiz();
        currentQuestionIndex = 0;
        score = 0;
        switchScreen('quiz-screen');
        renderQuestion();
    }

    function renderQuestion() {
        const qData = quizQuestions[currentQuestionIndex];
        
        document.getElementById('question-counter').innerText = 'السؤال ' + (currentQuestionIndex + 1) + ' من ' + quizQuestions.length;
        document.getElementById('score-counter').innerText = 'النقاط: ' + score;
        document.getElementById('question-text').innerText = qData.q;
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        qData.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            
            if(userAnswers[currentQuestionIndex] !== null) {
                btn.disabled = true;
                if(index === qData.answer) {
                    btn.classList.add('correct');
                } else if(index === userAnswers[currentQuestionIndex]) {
                    btn.classList.add('incorrect');
                }
            } else {
                btn.onclick = () => selectOption(index, btn);
            }
            
            optionsContainer.appendChild(btn);
        });

        const expBox = document.getElementById('explanation-box');
        if(userAnswers[currentQuestionIndex] !== null) {
            expBox.style.display = 'block';
            expBox.innerHTML = qData.exp;
        } else {
            expBox.style.display = 'none';
        }

        document.getElementById('prev-btn').style.display = currentQuestionIndex > 0 ? 'block' : 'none';
        
        const nextBtn = document.getElementById('next-btn');
        if(currentQuestionIndex === quizQuestions.length - 1) {
            nextBtn.innerText = 'إنهاء الاختبار';
            nextBtn.style.display = userAnswers[currentQuestionIndex] !== null ? 'block' : 'none';
            nextBtn.onclick = showResult;
        } else {
            nextBtn.innerText = 'التالي';
            nextBtn.style.display = userAnswers[currentQuestionIndex] !== null ? 'block' : 'none';
            nextBtn.onclick = nextQuestion;
        }
    }

    function selectOption(selectedIndex, btnElement) {
        const qData = quizQuestions[currentQuestionIndex];
        userAnswers[currentQuestionIndex] = selectedIndex;
        
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(btn => btn.disabled = true);

        if (selectedIndex === qData.answer) {
            btnElement.classList.add('correct');
            score++;
            document.getElementById('score-counter').innerText = 'النقاط: ' + score;
        } else {
            btnElement.classList.add('incorrect');
            allBtns[qData.answer].classList.add('correct');
        }

        const expBox = document.getElementById('explanation-box');
        expBox.style.display = 'block';
        expBox.innerHTML = qData.exp;

        const nextBtn = document.getElementById('next-btn');
        nextBtn.style.display = 'block';
    }

    function nextQuestion() {
        if(currentQuestionIndex < quizQuestions.length - 1) {
            currentQuestionIndex++;
            renderQuestion();
        }
    }

    function prevQuestion() {
        if(currentQuestionIndex > 0) {
            currentQuestionIndex--;
            renderQuestion();
        }
    }

    function showResult() {
        switchScreen('result-screen');
        const finalScoreElem = document.getElementById('final-score');
        finalScoreElem.innerText = score + ' / ' + quizQuestions.length;
        
        const percentage = (score / quizQuestions.length) * 100;
        let msg = '';
        if(percentage === 100) msg = 'ممتاز جداً! لقد استوعبت كل تفاصيل المحاضرة بدقة متناهية.';
        else if(percentage >= 80) msg = 'رائع! استيعابك قوي، راجع التأصيلات التي أخطأت فيها فقط.';
        else if(percentage >= 50) msg = 'جيد، لكنك تحتاج إلى مراجعة بعض المفاهيم الدقيقة في الدرس.';
        else msg = 'لا بأس، العلم يحتاج إلى تكرار. استمع للمحاضرة مرة أخرى وأعد الاختبار.';
        
        document.getElementById('result-message').innerText = msg;
    }

    function restartQuiz() {
        switchScreen('start-screen');
    }
</script>
